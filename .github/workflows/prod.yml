name: Docker Image CI/CD for Production

on:
  push:
    branches: ["production"]

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
  DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
  SSH_HOST: ${{ secrets.SSH_HOST }}
  SSH_USER: ${{ secrets.SSH_USER }}
  SSH_KEY: ${{ secrets.SSH_KEY }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Branch name
        run: echo running on branch ${GITHUB_REF##*/}

      - name: DockerHub Login
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Build the Docker image
        run: docker build . --file Dockerfile --tag ${{ env.DOCKER_USERNAME }}/zephix-server:${GITHUB_REF##*/}

      - name: Docker Push
        run: docker push ${{ env.DOCKER_USERNAME }}/zephix-server:${GITHUB_REF##*/}

      - name: Tag Docker image with version
        run: docker tag  ${{ env.DOCKER_USERNAME }}/zephix-server:${GITHUB_REF##*/} ${{ env.DOCKER_USERNAME }}/zephix-server:$(jq -r '.version' package.json)

      - name: Docker Push version
        run: docker push ${{ env.DOCKER_USERNAME }}/zephix-server:$(jq -r '.version' package.json)
  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: SSH to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USER }}
          key: ${{ env.SSH_KEY }}
          script: |
            cd /home/azad/projects/zephix/zephix-server
            docker compose down
            docker image prune -af
            docker compose pull
            docker compose up -d
  discord:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Test Success
        uses: rjstone/discord-webhook-notify@v1
        if: success()
        with:
          severity: info
          username: Zephix Server
          details: "The deployment was successful without any issues."
          webhookUrl: ${{ env.DISCORD_WEBHOOK }}
      - name: Test Failure
        uses: rjstone/discord-webhook-notify@v1
        if: failure()
        with:
          severity: error
          username: Zephix Server
          details: Test Failed!
          webhookUrl: ${{ env.DISCORD_WEBHOOK }}
      - name: Test Cancelled
        uses: rjstone/discord-webhook-notify@v1
        if: cancelled()
        with:
          severity: warn
          username: Zephix Server
          details: Test Cancelled!
          webhookUrl: ${{ env.DISCORD_WEBHOOK }}