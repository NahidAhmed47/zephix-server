services:
  zephix-server:
    container_name: zephix-server
    image: iazadur/zephix-server:production
    ports:
      - "4470:5000"
    environment:
      - PORT=5000
    env_file:
      - .env
    volumes:
      - ./logs:/usr/src/app/logs
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://127.0.0.1:5000/" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
